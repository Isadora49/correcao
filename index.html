<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injetor de Avatar na Ficha de RPG</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .painel { background: #202024; padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; box-sizing: border-box; border: 1px solid #323238; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #00b37e; text-align: center; }
        .grupo { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #a8a8b3; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { background: #121214; border: 1px solid #41414d; padding: 10px; border-radius: 4px; color: #fff; width: 100%; box-sizing: border-box; }
        button { background: #00b37e; color: #fff; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #00875f; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; color: #ff4757; }
        .nota { font-size: 12px; color: #7c7c8a; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="painel">
        <h2>Montador de Ficha com Foto</h2>
        
        <div class="grupo">
            <label>1. Envie a Ficha Limpa (PDF)</label>
            <input type="file" id="pdfInput" accept=".pdf">
        </div>

        <div class="grupo">
            <label>2. Envie a Foto do Personagem (JPG ou PNG)</label>
            <input type="file" id="imgInput" accept="image/png, image/jpeg">
        </div>

        <button onclick="mesclarImagemComPdf()">Gerar Ficha Completa</button>
        <div id="statusTexto" class="status"></div>
        <div class="nota">O arquivo final será baixado automaticamente com a foto fixada.</div>
    </div>

    <script>
        async function mesclarImagemComPdf() {
            const pdfInput = document.getElementById('pdfInput').files[0];
            const imgInput = document.getElementById('imgInput').files[0];
            const statusTexto = document.getElementById('statusTexto');

            if (!pdfInput || !imgInput) {
                statusTexto.innerText = "Por favor, selecione o PDF e a Imagem primeiro!";
                return;
            }

            statusTexto.style.color = "#00b37e";
            statusTexto.innerText = "Processando arquivo...";

            try {
                // 1. Lê os bytes do PDF e da Imagem
                const pdfBytes = await pdfInput.arrayBuffer();
                const imgBytes = await imgInput.arrayBuffer();

                // 2. Carrega o documento PDF
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                
                // 3. Embutir a imagem no PDF (detecta se é JPG ou PNG)
                let imagemEmbutida;
                if (imgInput.type === 'image/jpeg') {
                    imagemEmbutida = await pdfDoc.embedJpg(imgBytes);
                } else if (imgInput.type === 'image/png') {
                    imagemEmbutida = await pdfDoc.embedPng(imgBytes);
                } else {
                    throw new Error("Formato de imagem não suportado. Use JPG ou PNG.");
                }

                // 4. Pega a primeira página do PDF
                const paginas = pdfDoc.getPages();
                const primeiraPagina = paginas[0];

                // --- CONFIGURAÇÃO DA POSIÇÃO DA IMAGEM ---
                // Você pode ajustar esses valores baseados nas coordenadas do seu Avatar
                const larguraDesejada = 150;
                const alturaDesejada = 150;
                
                // Exemplo: desenhando a 50 pixels da borda esquerda e 600 pixels da borda inferior
                // (O eixo Y no PDF começa de baixo para cima)
                const posicaoX = 50; 
                const posicaoY = 600; 

                // 5. Desenha a imagem fundida na página
                primeiraPagina.drawImage(imagemEmbutida, {
                    x: posicaoX,
                    y: posicaoY,
                    width: larguraDesejada,
                    height: alturaDesejada,
                });

                // 6. Salva e baixa o novo PDF
                const pdfModificadoBytes = await pdfDoc.save();
                const blob = new Blob([pdfModificadoBytes], { type: "application/pdf" });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Ficha_com_Avatar.pdf`;
                link.click();

                statusTexto.innerText = "Sucesso! Ficha gerada com a imagem fundida.";
            } catch (erro) {
                console.error(erro);
                statusTexto.style.color = "#ff4757";
                statusTexto.innerText = "Erro: " + erro.message;
            }
        }
    </script>
</body>
</html>
