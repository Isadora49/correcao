<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injetor de Fórmulas no PDF</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
        }
        h1 { color: #ffca28; margin-top: 0; }
        p { color: #ccc; font-size: 0.95rem; line-height: 1.5; }
        
        .upload-box {
            border: 2px dashed #ffca28;
            padding: 30px;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
            background: #333344;
            display: block;
            transition: background 0.2s;
        }
        .upload-box:hover {
            background: #3a3a4f;
        }
        input[type="file"] { display: none; }
        
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #00bcd4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Automatizador de Somas</h1>
    <p>Carregue o seu PDF corrigido aqui. Este utilitário vai encontrar os campos centrais (C45, C46, C47) e programá-los para realizarem a soma automática com os respectivos totais (C8, C4, C7).</p>
    
    <label class="upload-box">
        <span id="upload-text">Clique aqui para selecionar o seu PDF</span>
        <input type="file" id="pdf-input" accept=".pdf">
    </label>

    <div class="status" id="status-message">Aguardando arquivo PDF...</div>
    
    <button id="process-btn" disabled>Injetar Fórmulas e Baixar PDF</button>
</div>

<script>
    const { PDFDocument, PDFName, PDFString } = window.PDFLib;
    
    const pdfInput = document.getElementById('pdf-input');
    const uploadText = document.getElementById('upload-text');
    const processBtn = document.getElementById('process-btn');
    const statusMessage = document.getElementById('status-message');
    
    let pdfBytes = null;

    // 1. CARREGA O PDF
    pdfInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadText.innerText = `Arquivo carregado: ${file.name}`;
        statusMessage.innerText = "Lendo campos para injeção matemática...";
        
        const arrayBuffer = await file.arrayBuffer();
        pdfBytes = new Uint8Array(arrayBuffer);
        
        statusMessage.innerText = "PDF pronto! Clique para aplicar as fórmulas.";
        processBtn.disabled = false;
    });

    // 2. INJETA OS SCRIPTS DE CÁLCULO NOS CAMPOS
    processBtn.addEventListener('click', async () => {
        try {
            statusMessage.innerText = "Programando os campos C45, C46 e C47...";
            
            const pdfDoc = await PDFDocument.load(pdfBytes);
            const form = pdfDoc.getForm();
            
            // Busca os campos pelos nomes internos definidos no seu gerador anterior
            // Lembrando que C4 virou 'res2', C7 virou 'res', e C8 é 'c8'
            const c45 = form.getField('c45');
            const c46 = form.getField('c46');
            const c47 = form.getField('c47');

            if (c45 && c46 && c47) {
                // Prepara C45 para somar com C8 (c8)
                c45.acroField.dict.set(PDFName.of('AA'), pdfDoc.context.obj({
                    C: { Type: 'Action', S: 'JavaScript', JS: PDFString.of('event.value = Number(this.getField("c8").value);') }
                }));
                // Protege o campo para que o usuário não sobrescreva a fórmula sem querer
                c45.enableReadOnly();

                // Prepara C46 para somar com C4 (res2)
                c46.acroField.dict.set(PDFName.of('AA'), pdfDoc.context.obj({
                    C: { Type: 'Action', S: 'JavaScript', JS: PDFString.of('event.value = Number(this.getField("res2").value);') }
                }));
                c46.enableReadOnly();

                // Prepara C47 para somar com C7 (res)
                c47.acroField.dict.set(PDFName.of('AA'), pdfDoc.context.obj({
                    C: { Type: 'Action', S: 'JavaScript', JS: PDFString.of('event.value = Number(this.getField("res").value);') }
                }));
                c47.enableReadOnly();

                // Salva as alterações
                const modifiedPdfBytes = await pdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: "application/pdf" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "ficha_com_somas.pdf";
                a.click();
                
                statusMessage.innerText = "Pronto! Fórmulas aplicadas e PDF baixado.";
            } else {
                statusMessage.innerText = "Erro: Não foi possível achar os campos centrais (C45, C46, C47).";
            }

        } catch (err) {
            console.error(err);
            statusMessage.innerText = "Erro ao injetar as fórmulas.";
            alert("Erro: " + err.message);
        }
    });
</script>

</body>
</html>
