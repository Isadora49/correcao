<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversor e Calculador de Campos PDF</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
        }
        h1 { color: #ffca28; margin-top: 0; }
        p { color: #ccc; font-size: 0.95rem; line-height: 1.5; }
        
        .upload-box {
            border: 2px dashed #ffca28;
            padding: 30px;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
            background: #333344;
            display: block;
            transition: background 0.2s;
        }
        .upload-box:hover {
            background: #3a3a4f;
        }
        input[type="file"] { display: none; }
        
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #00bcd4;
        }

        .info-box {
            background: #1a1a24;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #444;
            display: none;
            font-family: monospace;
            color: #a5d6a7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Corretor de Layout e Somas Dinâmicas</h1>
    <p>Este utilitário aplica a inversão física entre os totais <strong>C4</strong> e <strong>C7</strong> e atualiza o motor matemático do PDF para que os novos campos centrais (<strong>C45, C46 e C47</strong>) somem em tempo real aos totais.</p>
    
    <label class="upload-box">
        <span id="upload-text">Selecione o seu PDF para atualizar</span>
        <input type="file" id="pdf-input" accept=".pdf">
    </label>

    <div class="status" id="status-message">Aguardando arquivo PDF...</div>
    <div class="info-box" id="info-box"></div>
    
    <button id="process-btn" disabled>Aplicar Ajustes, Somas e Baixar PDF</button>
</div>

<script>
    const pdfInput = document.getElementById('pdf-input');
    const uploadText = document.getElementById('upload-text');
    const processBtn = document.getElementById('process-btn');
    const statusMessage = document.getElementById('status-message');
    const infoBox = document.getElementById('info-box');
    
    let pdfBytes = null;

    // 1. CARREGAMENTO E ANÁLISE DO PDF
    pdfInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadText.innerText = `Arquivo carregado: ${file.name}`;
        statusMessage.innerText = "Analisando estrutura de campos internos...";
        
        const arrayBuffer = await file.arrayBuffer();
        pdfBytes = new Uint8Array(arrayBuffer);
        
        try {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const form = pdfDoc.getForm();
            const fields = form.getFields();
            
            const names = fields.map(f => f.getName());
            infoBox.innerHTML = "<strong>Campos identificados:</strong><br>" + names.join(', ');
            infoBox.style.display = "block";
            
            statusMessage.innerText = `PDF pronto para processamento!`;
            processBtn.disabled = false;
        } catch (err) {
            statusMessage.innerText = "Erro ao ler os campos do PDF.";
            alert("Erro na leitura: " + err.message);
        }
    });

    // 2. CORREÇÃO FÍSICA E INJEÇÃO DO NOVO MOTOR DE CÁLCULO
    processBtn.addEventListener('click', async () => {
        try {
            statusMessage.innerText = "Ajustando posições e reconfigurando equações matemáticas...";
            
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const form = pdfDoc.getForm();
            const fields = form.getFields();

            let campoC4 = null;
            let campoC7 = null;

            // Identificação dos alvos para troca visual de posições
            fields.forEach(field => {
                const name = field.getName().toLowerCase();
                if (name === 'res' || name === 'c4' || name === 'c4 (total 1)') campoC4 = field;
                if (name === 'res2' || name === 'c7' || name === 'c7 (total 2)') campoC7 = field;
            });

            if (!campoC4 || !campoC7) {
                fields.forEach(field => {
                    const name = field.getName().toLowerCase();
                    if (name.includes('res') && !name.includes('2')) campoC4 = field;
                    if (name.includes('res2')) campoC7 = field;
                    if (name.includes('c4')) campoC4 = field;
                    if (name.includes('c7')) campoC7 = field;
                });
            }

            // Executa a troca física das coordenadas se os campos forem localizados
            if (campoC4 && campoC7) {
                const widgetsC4 = campoC4.acroField.getWidgets();
                const widgetsC7 = campoC7.acroField.getWidgets();

                if (widgetsC4.length > 0 && widgetsC7.length > 0) {
                    const rectC4 = widgetsC4[0].getRectangle();
                    const rectC7 = widgetsC7[0].getRectangle();

                    widgetsC4[0].setRectangle({ x: rectC7.x, y: rectC7.y, width: rectC7.width, height: rectC7.height });
                    widgetsC7[0].setRectangle({ x: rectC4.x, y: rectC4.y, width: rectC4.width, height: rectC4.height });
                }
            }

            // --- NOVO SCRIPT DO MOTOR DE CÁLCULO COM AS SOMAS EM TEMPO REAL ---
            const scriptMotor = [
                'var escolha = this.getField("c1").value;',
                'var bases = {',
                '  "Tank": [8,2,2], "Hibrido": [4,2,4], "Assassino": [2,2,8],',
                '  "Destruidor": [2,4,2], "Arcano": [2,4,2], "Mentalista": [2,4,2],',
                '  "Vitalista": [2,6,2], "Invocador": [2,6,2], "Elementalista": [2,5,2]',
                '};',
                'var b = bases[escolha] || [0,0,0];',
                'var valBase1 = b[0], valBase2 = b[1], valBase3 = b[2];',
                '',
                'function getDado(nivel) {',
                '  nivel = Number(nivel) || 0;',
                '  if (nivel >= 51) return "1d100"; if (nivel >= 36) return "1d50";',
                '  if (nivel >= 26) return "1d20"; if (nivel >= 21) return "1d12";',
                '  if (nivel >= 16) return "1d10"; if (nivel >= 11) return "1d8";',
                '  if (nivel >= 6) return "1d6"; return "1d4";',
                '}',
                '',
                'function getD(nivel) {',
                '  return (nivel >= 51)?100:(nivel >= 36)?50:(nivel >= 26)?20:(nivel >= 21)?12:(nivel >= 16)?10:(nivel >= 11)?8:(nivel >= 6)?6:4;',
                '}',
                '',
                '// Coleta e validação dos valores digitados nos novos campos centrais',
                'var extraC45 = Number(this.getField("c45") ? this.getField("c45").value : 0) || 0;',
                'var extraC46 = Number(this.getField("c46") ? this.getField("c46").value : 0) || 0;',
                'var extraC47 = Number(this.getField("c47") ? this.getField("c47").value : 0) || 0;',
                '',
                '// Cálculos da primeira linha (Nível 1)',
                'var n1 = Number(this.getField("c2").value) || 0;',
                'this.getField("c3").value = getDado(n1);',
                'this.getField("res").value = (valBase1 * n1) + getD(n1) + extraC45; // C4 (Total 1) + C45',
                'this.getField("c8").value = (valBase3 * n1) + getD(n1) + extraC46; // C8 (Total 3) + C46',
                '',
                '// Cálculos da segunda linha (Nível 2)',
                'var n2 = Number(this.getField("c5").value) || 0;',
                'this.getField("c6").value = getDado(n2);',
                'this.getField("res2").value = (valBase2 * n2) + getD(n2) + extraC47; // C7 (Total 2) + C47',
                '',
                '// Atualização automática dos demais dados das colunas',
                'for (var i = 9; i <= 35; i += 2) {',
                '  var nivelField = this.getField("c" + i);',
                '  var dadoField = this.getField("c" + (i + 1));',
                '  if (nivelField && dadoField) { dadoField.value = getDado(nivelField.value); }',
                '}'
            ].join('\n');

            const action = pdfDoc.context.obj({
                Type: 'Action',
                S: 'JavaScript',
                JS: PDFString.of(scriptMotor)
            });

            form.acroForm.dict.set(PDFName.of('NeedAppearances'), pdfDoc.context.obj(true));

            // Registra a ordem de cálculo prioritária para os campos de resultado
            try {
                const resField = form.getField('res');
                const res2Field = form.getField('res2');
                resField.acroField.dict.set(PDFName.of('AA'), pdfDoc.context.obj({ C: action }));
                res2Field.acroField.dict.set(PDFName.of('AA'), pdfDoc.context.obj({ C: action }));
                form.acroForm.dict.set(PDFName.of('CO'), pdfDoc.context.obj([ resField.ref, res2Field.ref ]));
            } catch (e) { console.warn(e); }

            // ADICIONADO: c45, c46 e c47 na lista de escuta ativa de gatilhos
            const triggerNames = [
                'c1', 'c2', 'c5', 'c9', 'c11', 'c13', 'c15', 'c17', 'c19', 'c21', 'c23', 
                'c25', 'c27', 'c29', 'c31', 'c33', 'c35', 'c45', 'c46', 'c47'
            ];

            triggerNames.forEach(name => {
                try {
                    const field = form.getField(name);
                    field.acroField.dict.set(PDFName.of('AA'), pdfDoc.context.obj({ K: action, V: action }));
                    const widgets = field.acroField.getWidgets();
                    if (widgets && widgets.length > 0) {
                        const widget = widgets[0];
                        let widgetAA = widget.dict.get(PDFName.of('AA'));
                        if (!widgetAA) {
                            widgetAA = pdfDoc.context.obj({});
                            widget.dict.set(PDFName.of('AA'), widgetAA);
                        }
                        widgetAA.set(PDFName.of('Bl'), action);
                    }
                } catch(e) { console.warn("Aviso ao vincular gatilho no campo opcional:", name); }
            });

            // GERA E DISPARA O DOWNLOAD AUTOMÁTICO
            const finalPdfBytes = await pdfDoc.save();
            const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "ficha_calculos_atualizados.pdf";
            a.click();
            statusEl = statusMessage.innerText = "Sucesso! O novo PDF inteligente foi baixado.";
        } catch (err) {
            console.error(err);
            statusMessage.innerText = "Erro técnico ao modificar equações.";
            alert("Erro: " + err.message);
        }
    });
</script>

</body>
</html>
