<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Ficha RPG Interativa</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 450px; margin: 0 auto; background: #121214; color: #fff; }
        .box { background: #202024; padding: 25px; border-radius: 8px; border: 1px solid #323238; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h3 { text-align: center; color: #00b37e; margin-top: 0; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #c4c4cc; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #121214; border: 1px solid #29292e; border-radius: 4px; color: #fff; box-sizing: border-box; }
        .coords { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 100%; background: #00b37e; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #00875f; }
        #log { margin-top: 15px; text-align: center; font-size: 13px; color: #8d8d99; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Gerador de Campo de Foto Nativo</h3>
        
        <div class="field">
            <label>1. Suba o PDF base da sua Ficha:</label>
            <input type="file" id="pdfBase" accept=".pdf">
        </div>

        <label>2. Onde o campo de foto deve ficar? (Coordenadas):</label>
        <div class="coords">
            <div class="field">
                <label>Posição X (Horizontal):</label>
                <input type="number" id="posX" value="400">
            </div>
            <div class="field">
                <label>Posição Y (Vertical):</label>
                <input type="number" id="posY" value="600">
            </div>
            <div class="field">
                <label>Largura (px):</label>
                <input type="number" id="largura" value="110">
            </div>
            <div class="field">
                <label>Altura (px):</label>
                <input type="number" id="altura" value="130">
            </div>
        </div>

        <button onclick="gerarPdfInteligente()">Injetar Campo de Foto e Baixar</button>
        <div id="log"></div>
    </div>

    <script>
        async function gerarPdfInteligente() {
            const fileInput = document.getElementById('pdfBase');
            const log = document.getElementById('log');
            
            if (!fileInput.files[0]) {
                alert('Por favor, selecione um arquivo PDF primeiro!');
                return;
            }

            log.style.color = "#8d8d99";
            log.innerText = "Injetando lógica Acrobat no PDF...";

            try {
                const arrayBuffer = await fileInput.files[0].arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const form = pdfDoc.getForm();
                const paginas = pdfDoc.getPages();
                const primeiraPagina = paginas[0];

                // Coletas dos tamanhos informados na tela
                const x = parseFloat(document.getElementById('posX').value) || 0;
                const y = parseFloat(document.getElementById('posY').value) || 0;
                const w = parseFloat(document.getElementById('largura').value) || 100;
                const h = parseFloat(document.getElementById('altura').value) || 100;

                // 1. Cria o campo de botão que vai receber a imagem
                const nomeDoCampo = "campo_foto_personagem";
                const botaoFoto = form.createButton(nomeDoCampo);
                botaoFoto.addToPage(primeiraPagina, { x: x, y: y, width: w, height: h });
                
                // Texto provisório para orientar o jogador
                botaoFoto.setLabel("Clique para adicionar foto");

                // 2. PROTEÇÃO CONTRA ERROS: Código JavaScript puro do Acrobat que rodará DENTRO do PDF
                // Ele usa um bloco try/catch interno para avisar o jogador se o leitor dele for incompatível.
                const codigoAcrobat = `
                    try {
                        this.importIcon("${nomeDoCampo}");
                    } catch(erro) {
                        app.alert({
                            cMsg: "Aviso: Para adicionar ou alterar a foto diretamente no arquivo, você precisa abrir esta ficha usando o aplicativo gratuito 'Adobe Acrobat Reader' no Computador (PC ou Mac).\\n\\nVisualizadores de navegador (Chrome/Edge) ou de celular não possuem essa tecnologia.",
                            nIcon: 1,
                            cTitle: "Recurso do Sistema"
                        });
                    }
                `;

                // 3. Injeção de Baixo Nível (Garante compatibilidade e evita falhas de compilação da biblioteca)
                const context = pdfDoc.context;
                const acaoJS = context.obj({
                    S: PDFLib.PDFName.of('JavaScript'),
                    JS: PDFLib.PDFString.of(codigoAcrobat)
                });
                const dicionarioAcoes = context.obj({
                    U: acaoJS // 'U' significa Mouse Up (Quando o jogador solta o clique do mouse)
                });

                // Vincula a ação de clique diretamente nas propriedades estruturais do botão
                botaoFoto.acroField.dict.set(PDFLib.PDFName.of('AA'), dicionarioAcoes);

                // Salva o novo arquivo modificado
                const pdfModificadoBytes = await pdfDoc.save();

                // Faz o download automático do arquivo pronto
                const blob = new Blob([pdfModificadoBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "ficha_com_foto_habilitada.pdf";
                link.click();

                log.style.color = "#00b37e";
                log.innerText = "Sucesso! Ficha inteligente baixada.";

            } catch (erro) {
                console.error(erro);
                log.style.color = "#f75a68";
                log.innerText = "Erro no processamento: " + erro.message;
            }
        }
    </script>
</body>
</html>
