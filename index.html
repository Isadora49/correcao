<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório: Teoria do Rich Text</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .painel-controle { background: #202024; padding: 20px; border-radius: 8px; width: 100%; max-width: 700px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #323238; }
        h2 { margin-top: 0; color: #ff4757; text-align: center; }
        .linha { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .campo { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        label { font-size: 13px; color: #a8a8b3; margin-bottom: 5px; font-weight: bold; }
        input[type="file"], input[type="number"] { background: #121214; border: 1px solid #41414d; padding: 10px; border-radius: 4px; color: #fff; }
        button { background: #00b37e; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #00875f; }
        
        .area-trabalho { position: relative; margin-top: 10px; border: 2px dashed #41414d; background: #202024; display: inline-block; max-width: 100%; overflow: auto; }
        #pdfCanvas { display: block; max-width: 100%; height: auto; }
        
        #caixaAvatar {
            position: absolute; top: 50px; left: 50px; width: 150px; height: 150px;
            border: 2px dashed #ff4757; background: rgba(255, 71, 87, 0.2);
            cursor: move; user-select: none; box-sizing: border-box; display: none;
        }
        .alca-redimensionar {
            position: absolute; width: 15px; height: 15px; background: #ff4757;
            bottom: 0; right: 0; cursor: se-resize;
        }
        .status { text-align: center; margin-top: 10px; font-weight: bold; color: #ff4757; }
        .instrucoes { background: #29292e; padding: 10px; border-radius: 6px; font-size: 13px; color: #c4c4cc; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="painel-controle">
        <h2>Laboratório: Campo HTML/Rich Text</h2>
        
        <div class="linha">
            <div class="campo">
                <label>1. Carregar o PDF da Ficha Limpa</label>
                <input type="file" id="pdfInput" accept=".pdf">
            </div>
            <div class="campo">
                <label>Tamanho Manual do Campo</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="numLargura" value="150" style="width:50%">
                    <input type="number" id="numAltura" value="150" style="width:50%">
                </div>
            </div>
        </div>

        <button onclick="gerarPdfInterativo()">Gerar PDF com Rich Text</button>
        <div id="statusTexto" class="status" style="color: #00b37e;"></div>
        
        <div class="instrucoes">
            <strong>O Teste:</strong> Abra o PDF gerado e cole a tag HTML <code>&lt;img src="link_da_imagem.jpg"&gt;</code> dentro do campo.
        </div>
    </div>

    <div class="area-trabalho" id="areaTrabalho">
        <canvas id="pdfCanvas"></canvas>
        <div id="caixaAvatar">
            <div class="alca-redimensionar" id="alca"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfOriginalBytes = null;

        const pdfInput = document.getElementById('pdfInput');
        const canvas = document.getElementById('pdfCanvas');
        const caixaAvatar = document.getElementById('caixaAvatar');
        const numLargura = document.getElementById('numLargura');
        const numAltura = document.getElementById('numAltura');
        const statusTexto = document.getElementById('statusTexto');

        function obterNumeroSeguro(valor, padrao = 0) {
            const numero = parseFloat(valor);
            return isNaN(numero) ? padrao : numero;
        }

        pdfInput.addEventListener('change', async (e) => {
            const arquivo = e.target.files[0];
            if (!arquivo) return;

            statusTexto.style.color = "#00b37e";
            statusTexto.innerText = "Carregando...";
            
            try {
                pdfOriginalBytes = await arquivo.arrayBuffer();
                const dadosCarregados = pdfjsLib.getDocument({ data: pdfOriginalBytes.slice(0) });
                const pdfDocumentoRenderizado = await dadosCarregados.promise;
                
                const pagina = await pdfDocumentoRenderizado.getPage(1);
                const escalaTela = 1.2;
                const viewportContexto = pagina.getViewport({ scale: escalaTela });
                const contexto = canvas.getContext('2d');
                
                canvas.width = viewportContexto.width;
                canvas.height = viewportContexto.height;

                await pagina.render({ canvasContext: contexto, viewport: viewportContexto }).promise;

                caixaAvatar.style.display = "block";
                statusTexto.innerText = "Ficha carregada! Posicione o campo.";
            } catch (erro) {
                console.error(erro);
            }
        });

        let arrastando = false, redimensionando = false;
        let noX = 0, noY = 0, larguraInicio = 0, alturaInicio = 0;

        caixaAvatar.addEventListener('mousedown', (e) => {
            if (e.target.id === 'alca') return;
            arrastando = true;
            noX = e.clientX - caixaAvatar.offsetLeft;
            noY = e.clientY - caixaAvatar.offsetTop;
        });

        document.getElementById('alca').addEventListener('mousedown', (e) => {
            redimensionando = true;
            e.stopPropagation();
            noX = e.clientX;
            noY = e.clientY;
            larguraInicio = obterNumeroSeguro(caixaAvatar.offsetWidth, 150);
            alturaInicio = obterNumeroSeguro(caixaAvatar.offsetHeight, 150);
        });

        document.addEventListener('mousemove', (e) => {
            if (arrastando) {
                let x = e.clientX - noX;
                let y = e.clientY - noY;
                x = Math.max(0, Math.min(x, canvas.clientWidth - caixaAvatar.offsetWidth));
                y = Math.max(0, Math.min(y, canvas.clientHeight - caixaAvatar.offsetHeight));
                caixaAvatar.style.left = x + 'px';
                caixaAvatar.style.top = y + 'px';
            } else if (redimensionando) {
                let novaLargura = larguraInicio + (e.clientX - noX);
                let novaAltura = alturaInicio + (e.clientY - noY);
                caixaAvatar.style.width = Math.max(30, novaLargura) + 'px';
                caixaAvatar.style.height = Math.max(30, novaAltura) + 'px';
                numLargura.value = Math.max(30, novaLargura);
                numAltura.value = Math.max(30, novaAltura);
            }
        });

        document.addEventListener('mouseup', () => { arrastando = false; redimensionando = false; });

        async function gerarPdfInterativo() {
            if (!pdfOriginalBytes) { alert("Carregue um PDF primeiro!"); return; }

            statusTexto.style.color = "#00b37e";
            statusTexto.innerText = "Injetando Campo HTML/Rich Text...";

            try {
                const pdfDoc = await PDFLib.PDFDocument.load(pdfOriginalBytes.slice(0));
                const primeiraPagina = pdfDoc.getPages()[0];

                const { width: pdfWidthReal, height: pdfHeightReal } = primeiraPagina.getSize();
                const fatorX = pdfWidthReal / obterNumeroSeguro(canvas.clientWidth, 1);
                const fatorY = pdfHeightReal / obterNumeroSeguro(canvas.clientHeight, 1);

                const htmlX = obterNumeroSeguro(caixaAvatar.offsetLeft, 0);
                const htmlY = obterNumeroSeguro(caixaAvatar.offsetTop, 0);
                const htmlLargura = obterNumeroSeguro(caixaAvatar.offsetWidth, 150);
                const htmlAltura = obterNumeroSeguro(caixaAvatar.offsetHeight, 150);

                const pdfX = htmlX * fatorX;
                const pdfY = (obterNumeroSeguro(canvas.clientHeight, 1) - (htmlY + htmlAltura)) * fatorY;
                const pdfLargura = htmlLargura * fatorX;
                const pdfAltura = htmlAltura * fatorY;

                const nomeDoCampo = "Campo_RichText_" + Math.floor(Math.random() * 10000);

                // Configuração Mágica: Bit 13 (Multiline) + Bit 26 (RichText) = 33558528
                const FLAG_RICH_TEXT = 33558528;

                const annotTextoDict = pdfDoc.context.obj({
                    Type: PDFLib.PDFName.of('Annot'),
                    Subtype: PDFLib.PDFName.of('Widget'),
                    FT: PDFLib.PDFName.of('Tx'), // Text Field
                    Ff: PDFLib.PDFNumber.
