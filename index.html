<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de RPG Interativa</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .ficha { background: #202024; padding: 30px; border-radius: 8px; width: 100%; max-width: 600px; border: 1px solid #323238; box-sizing: border-box; }
        h2 { color: #ff4757; text-align: center; margin-top: 0; }
        .campo-texto { width: 100%; padding: 10px; background: #121214; border: 1px solid #41414d; border-radius: 4px; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
        
        /* Área do Avatar */
        .container-avatar { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .moldura-avatar { width: 150px; height: 150px; border: 2px dashed #ff4757; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #121214; margin-bottom: 10px; }
        .moldura-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .moldura-avatar span { color: #7c7c8a; font-size: 14px; text-align: center; padding: 10px; }
        
        button { background: #00b37e; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #00875f; }

        /* Configuração para quando for gerar o PDF/Imprimir */
        @media print {
            body { background: white; color: black; padding: 0; }
            .ficha { border: none; background: white; width: 100%; max-width: 100%; }
            .nao-imprimir { display: none; }
            .campo-texto { border: none; background: transparent; color: black; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="ficha">
        <h2>Ficha de Personagem</h2>
        
        <div class="container-avatar">
            <div class="moldura-avatar" id="moldura">
                <span id="textoPlaceholder">Cole o link abaixo para ver a foto</span>
                <img id="fotoAvatar" src="" alt="Avatar">
            </div>
            <input type="text" id="inputLink" class="campo-texto nao-imprimir" placeholder="Cole o link da imagem aqui...">
        </div>

        <label>Nome do Personagem:</label>
        <input type="text" class="campo-texto" placeholder="Ex: Aratborn">

        <label>Classe / Raça:</label>
        <input type="text" class="campo-texto" placeholder="Ex: Guerreiro Elfo">

        <button class="nao-imprimir" onclick="salvarComoPdf()">Exportar Ficha em PDF</button>
    </div>

    <script>
        const inputLink = document.getElementById('inputLink');
        const fotoAvatar = document.getElementById('fotoAvatar');
        const textoPlaceholder = document.getElementById('textoPlaceholder');

        // Escuta o link que o usuário colar e atualiza a imagem na hora
        inputLink.addEventListener('input', () => {
            const url = inputLink.value.trim();
            if (url) {
                fotoAvatar.src = url;
                fotoAvatar.style.display = 'block';
                textoPlaceholder.style.display = 'none';
            } else {
                fotoAvatar.src = '';
                fotoAvatar.style.display = 'none';
                textoPlaceholder.style.display = 'block';
            }
        });

        // Função que aciona o motor de PDF do próprio navegador
        function salvarComoPdf() {
            window.print();
        }
    </script>
</body>
</html>
