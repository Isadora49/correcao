<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Ficha RPG - Posicionamento Visual</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .painel-controle { background: #202024; padding: 20px; border-radius: 8px; width: 100%; max-width: 700px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #323238; }
        h2 { margin-top: 0; color: #ff4757; text-align: center; }
        .linha { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .campo { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        label { font-size: 13px; color: #a8a8b3; margin-bottom: 5px; font-weight: bold; }
        input[type="file"], input[type="number"] { background: #121214; border: 1px solid #41414d; padding: 10px; border-radius: 4px; color: #fff; }
        button { background: #ff4757; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #e84118; }
        
        /* Área do Canvas e do Quadrado Arrastável */
        .area-trabalho { position: relative; margin-top: 10px; border: 2px dashed #41414d; background: #202024; display: inline-block; max-width: 100%; overflow: auto; }
        #pdfCanvas { display: block; max-width: 100%; height: auto; }
        
        /* Caixa do Avatar customizável */
        #caixaAvatar {
            position: absolute; top: 50px; left: 50px; width: 120px; height: 120px;
            border: 2px solid #ff4757; background: rgba(255, 71, 87, 0.3);
            cursor: move; user-select: none; box-sizing: border-box; display: none;
        }
        /* Alça de redimensionamento no canto inferior direito */
        .alca-redimensionar {
            position: absolute; width: 15px; height: 15px; background: #ff4757;
            bottom: 0; right: 0; cursor: se-resize;
        }
        .status { text-align: center; margin-top: 10px; font-weight: bold; color: #00b37e; }
    </style>
</head>
<body>

    <div class="painel-controle">
        <h2>Editor Visual de Ficha</h2>
        
        <div class="linha">
            <div class="campo">
                <label>1. Carregar PDF da Ficha</label>
                <input type="file" id="pdfInput" accept=".pdf">
            </div>
            <div class="campo">
                <label>2. Carregar Foto do Personagem</label>
                <input type="file" id="imageInput" accept=".png, .jpg, .jpeg">
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label>Ajuste de Tamanho Manual (Opcional)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="numLargura" value="120" style="width:50%">
                    <input type="number" id="numAltura" value="120" style="width:50%">
                </div>
            </div>
        </div>

        <button onclick="salvarPdfFinal()">Aplicar Foto e Baixar PDF</button>
        <div id="statusTexto" class="status"></div>
    </div>

    <div class="area-trabalho" id="areaTrabalho">
        <canvas id="pdfCanvas"></canvas>
        <div id="caixaAvatar">
            <div class="alca-redimensionar" id="alca"></div>
        </div>
    </div>

    <script>
        // Configuração obrigatória do PDF.js para funcionar via link (CDN)
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfOriginalBytes = null;
        let pdfDocumentoRenderizado = null;
        let pdfDimensõesOriginais = { width: 0, height: 0 };

        const pdfInput = document.getElementById('pdfInput');
        const canvas = document.getElementById('pdfCanvas');
        const caixaAvatar = document.getElementById('caixaAvatar');
        const areaTrabalho = document.getElementById('areaTrabalho');
        const numLargura = document.getElementById('numLargura');
        const numAltura = document.getElementById('numAltura');
        const statusTexto = document.getElementById('statusTexto');

        // --- 1. FUNÇÃO DE PROTEÇÃO CONTRA NaN ---
        // Garante que qualquer cálculo que falhar retorne um número padrão seguro
        function obterNumeroSeguro(valor, padrao = 0) {
            const numero = parseFloat(valor);
            return isNaN(numero) ? padrao : numero;
        }

        // --- 2. CARREGAR E RENDERIZAR O PDF VISUALMENTE ---
        pdfInput.addEventListener('change', async (e) => {
            const arquivo = e.target.files[0];
            if (!arquivo) return;

            statusTexto.innerText = "Carregando visualização da ficha...";
            
            try {
                pdfOriginalBytes = await arquivo.arrayBuffer();
                
                // Carrega o PDF para visualização na tela
                const dadosCarregados = pdfjsLib.getDocument({ data: pdfOriginalBytes });
                pdfDocumentoRenderizado = await dadosCarregados.promise;
                
                // Pega a primeira página
                const pagina = await pdfDocumentoRenderizado.getPage(1);
                
                // Pega as dimensões reais do PDF (Será usado para evitar o erro de NaN)
                const viewportOriginal = pagina.getViewport({ scale: 1.0 });
                pdfDimensõesOriginais.width = obterNumeroSeguro(viewportOriginal.width, 595);
                pdfDimensõesOriginais.height = obterNumeroSeguro(viewportOriginal.height, 842);

                // Define uma escala de visualização confortável na tela
                const escalaTela = 1.2;
                const viewportContexto = pagina.getViewport({ scale: escalaTela });

                const contexto = canvas.getContext('2d');
                canvas.width = viewportContexto.width;
                canvas.height = viewportContexto.height;

                // Renderiza o PDF de fato dentro do Canvas HTML
                await pagina.render({ canvasContext: contexto, viewport: viewportContexto }).promise;

                // Mostra a caixa do Avatar por cima
                caixaAvatar.style.display = "block";
                statusTexto.innerText = "Ficha carregada! Arraste o quadrado vermelho para onde quer a foto.";
            } catch (erro) {
                console.error(erro);
                statusTexto.innerText = "Erro ao renderizar PDF: " + erro.message;
            }
        });

        // --- 3. LÓGICA DE ARRASTAR E REDIMENSIONAR (MOUSE E TOQUE) ---
        let arrastando = false, redimensionando = false;
        let noX = 0, noY = 0, larguraInicio = 0, alturaInicio = 0;

        // Iniciar Arrastar
        caixaAvatar.addEventListener('mousedown', (e) => {
            if (e.target.id === 'alca') return; // Se clicou na alça, pula para redimensionar
            arrastando = true;
            noX = e.clientX - caixaAvatar.offsetLeft;
            noY = e.clientY - caixaAvatar.offsetTop;
        });

        // Iniciar Redimensionar
        document.getElementById('alca').addEventListener('mousedown', (e) => {
            redimensionando = true;
            e.stopPropagation();
            noX = e.clientX;
            noY = e.clientY;
            larguraInicio = obterNumeroSeguro(caixaAvatar.offsetWidth);
            alturaInicio = obterNumeroSeguro(caixaAvatar.offsetHeight);
        });

        // Movimentação Geral (Mouse)
        document.addEventListener('mousemove', (e) => {
            if (arrastando) {
                let x = e.clientX - noX;
                let y = e.clientY - noY;
                // Limita para não sair da área do PDF
                x = Math.max(0, Math.min(x, canvas.clientWidth - caixaAvatar.offsetWidth));
                y = Math.max(0, Math.min(y, canvas.clientHeight - caixaAvatar.offsetHeight));
                caixaAvatar.style.left = x + 'px';
                caixaAvatar.style.top = y + 'px';
            } else if (redimensionando) {
                let novaLargura = larguraInicio + (e.clientX - noX);
                let novaAltura = alturaInicio + (e.clientY - noY);
                
                // Mantém tamanho mínimo de 30px para não sumir e quebrar cálculos
                novaLargura = Math.max(30, novaLargura);
                novaAltura = Math.max(30, novaAltura);

                caixaAvatar.style.width = novaLargura + 'px';
                caixaAvatar.style.height = novaAltura + 'px';
                numLargura.value = novaLargura;
                numAltura.value = novaAltura;
            }
        });

        document.addEventListener('mouseup', () => { arrastando = false; redimensionando = false; });

        // Sincronizar inputs manuais com a caixa visual se o usuário digitar
        function atualizarCaixaPorInputs() {
            caixaAvatar.style.width = obterNumeroSeguro(numLargura.value, 120) + 'px';
            caixaAvatar.style.height = obterNumeroSeguro(numAltura.value, 120) + 'px';
        }
        numLargura.addEventListener('input', atualizarCaixaPorInputs);
        numAltura.addEventListener('input', atualizarCaixaPorInputs);


        // --- 4. INJETAR IMAGEM USANDO COORDENADAS CONVERTIDAS (BLINDADO CONTRA NaN) ---
        async function salvarPdfFinal() {
            const arquivoImagem = document.getElementById('imageInput').files[0];
            if (!pdfOriginalBytes) { alert("Por favor, carregue um PDF primeiro!"); return; }
            if (!arquivoImagem) { alert("Por favor, selecione a foto do personagem!"); return; }

            statusTexto.innerText = "Injetando imagem na ficha...";

            try {
                const imagemBytes = await arquivoImagem.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(pdfOriginalBytes);
                
                let imagemEmbutida;
                if (arquivoImagem.type === "image/png") {
                    imagemEmbutida = await pdfDoc.embedPng(imagemBytes);
                } else {
                    imagemEmbutida = await pdfDoc.embedJpg(imagemBytes);
                }

                const paginas = pdfDoc.getPages();
                const primeiraPagina = paginas[0];

                // Fatores de escala entre o tamanho do Canvas na tela e o tamanho real do PDF
                const canvasLarguraVisivel = obterNumeroSeguro(canvas.clientWidth, 1);
                const canvasAlturaVisivel = obterNumeroSeguro(canvas.clientHeight, 1);

                const fatorX = pdfDimensõesOriginais.width / canvasLarguraVisivel;
                const fatorY = pdfDimensõesOriginais.height / canvasAlturaVisivel;

                // Coletas da posição da caixa HTML
                const htmlX = obterNumeroSeguro(caixaAvatar.offsetLeft, 0);
                const htmlY = obterNumeroSeguro(caixaAvatar.offsetTop, 0);
                const htmlLargura = obterNumeroSeguro(caixaAvatar.offsetWidth, 100);
                const htmlAltura = obterNumeroSeguro(caixaAvatar.offsetHeight, 100);

                // --- CONVERSÃO MATEMÁTICA PROTEGIDA ---
                // PDF calcula o Y de baixo para cima. Canvas calcula de cima para baixo.
                const pdfX = htmlX * fatorX;
                const pdfY = (canvasAlturaVisivel - (htmlY + htmlAltura)) * fatorY;
                const pdfLargura = htmlLargura * fatorX;
                const pdfAltura = htmlAltura * fatorY;

                // Validação final anti-NaN absoluta antes de mandar para a biblioteca do PDF
                if (isNaN(pdfX) || isNaN(pdfY) || isNaN(pdfLargura) || isNaN(pdfAltura)) {
                    throw new Error("Erro de cálculo nas coordenadas. Valores geraram NaN.");
                }

                // Desenha a foto na posição exata determinada visualmente pelo usuário
                primeiraPagina.drawImage(imagemEmbutida, {
                    x: pdfX,
                    y: pdfY,
                    width: pdfLargura,
                    height: pdfAltura
                });

                // Salva e disponibiliza para download
                const pdfModificadoBytes = await pdfDoc.save();
                const blob = new BundleBlob([pdfModificadoBytes]);
                function BundleBlob(parts) { return new Blob(parts, { type: "application/pdf" }); }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `ficha_com_avatar_${arquivoImagem.name.split('.')[0]}.pdf`;
                link.click();

                statusTexto.innerText = "Pronto! Ficha baixada com sucesso.";
            } catch (erro) {
                console.error(erro);
                statusTexto.style.color = "#ff4757";
                statusTexto.innerText = "Erro no processamento: " + erro.message;
            }
        }
    </script>
</body>
</html>
