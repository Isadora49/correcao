<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Botão de Avatar</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #1e1e24; color: #fff; }
        .card { background: #2a2a35; padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); border: 1px solid #444; }
        h2 { text-align: center; margin-top: 0; color: #3498db; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc; }
        input[type="file"] { width: 100%; padding: 10px; background: #1e1e24; border: 1px solid #555; border-radius: 6px; color: #fff; box-sizing: border-box; }
        .grid-ajustes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .grid-ajustes input { width: 100%; padding: 8px; background: #1e1e24; border: 1px solid #555; border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { background: #3498db; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #2980b9; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; color: #2ed573; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Injetar Botão Interativo no PDF</h2>
        <p style="font-size: 13px; color: #aaa; text-align: center;">Use esta ferramenta para criar a Ficha Mestra com o botão de upload que funciona no Adobe Acrobat.</p>
        
        <div class="input-group">
            <label>Selecione a Ficha Base (PDF):</label>
            <input type="file" id="pdfInput" accept=".pdf">
        </div>

        <label>Posição do Botão na Ficha:</label>
        <div class="grid-ajustes">
            <div>
                <label>Posição X (Esquerda/Direita):</label>
                <input type="number" id="coordX" value="400">
            </div>
            <div>
                <label>Posição Y (Baixo/Cima):</label>
                <input type="number" id="coordY" value="600">
            </div>
            <div>
                <label>Largura (px):</label>
                <input type="number" id="imgWidth" value="120">
            </div>
            <div>
                <label>Altura (px):</label>
                <input type="number" id="imgHeight" value="120">
            </div>
        </div>

        <button onclick="gerarFichaMestra()">Gerar Ficha Mestra</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function gerarFichaMestra() {
            const pdfFile = document.getElementById('pdfInput').files[0];
            const statusDiv = document.getElementById('status');

            if (!pdfFile) {
                alert('Por favor, envie o PDF da ficha!');
                return;
            }

            statusDiv.innerText = "Criando botão interativo...";

            try {
                const pdfBytes = await pdfFile.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                
                // Pega ou cria o formulário da ficha
                const form = pdfDoc.getForm();
                
                // Cria o campo de botão
                const nomeDoBotao = 'BotaoAvatarRPG';
                const button = form.createButton(nomeDoBotao);

                const x = parseFloat(document.getElementById('coordX').value);
                const y = parseFloat(document.getElementById('coordY').value);
                const largura = parseFloat(document.getElementById('imgWidth').value);
                const altura = parseFloat(document.getElementById('imgHeight').value);

                const paginas = pdfDoc.getPages();
                const primeiraPagina = paginas[0];

                // Desenha o botão na página com uma cor de fundo clara
                button.addToPage(primeiraPagina, {
                    x: x,
                    y: y,
                    width: largura,
                    height: altura,
                    backgroundColor: PDFLib.rgb(0.9, 0.9, 0.9),
                    borderColor: PDFLib.rgb(0, 0, 0),
                    borderWidth: 1,
                });

                // A MÁGICA: Injetando o JavaScript do Acrobat dentro do PDF
                const widget = button.acroField.getWidgets()[0];
                
                // Código JavaScript que rodará apenas no Adobe Acrobat do jogador
                const codigoAcrobatJS = `
                    try { 
                        var campo = this.getField("${nomeDoBotao}"); 
                        campo.buttonImportIcon(); 
                    } catch(e) { 
                        app.alert("Para adicionar a imagem, abra esta ficha no Adobe Acrobat Reader no computador."); 
                    }
                `;

                // Configuração avançada do PDF-Lib para adicionar a Ação (Action) no botão
                const jsAction = pdfDoc.context.obj({
                    Type: 'Action',
                    S: 'JavaScript',
                    JS: PDFLib.PDFString.of(codigoAcrobatJS)
                });
                
                // Aplica a ação ao Widget (Botão)
                widget.dict.set(PDFLib.PDFName.of('A'), jsAction);

                // Salva o PDF Mestre
                const pdfModificadoBytes = await pdfDoc.save();

                const blob = new Blob([pdfModificadoBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Ficha_Mestra_Interativa.pdf`;
                link.click();

                statusDiv.innerText = "Pronto! Ficha Mestra baixada.";
            } catch (erro) {
                console.error(erro);
                statusDiv.style.color = "#ff4757";
                statusDiv.innerText = "Erro ao processar: " + erro.message;
            }
        }
    </script>
</body>
</html>
