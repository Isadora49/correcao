<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversor de Campos PDF (C4 ⇄ C7)</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
        }
        h1 { color: #ffca28; margin-top: 0; }
        p { color: #ccc; font-size: 0.95rem; line-height: 1.5; }
        
        .upload-box {
            border: 2px dashed #ffca28;
            padding: 30px;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
            background: #333344;
            display: block;
            transition: background 0.2s;
        }
        .upload-box:hover {
            background: #3a3a4f;
        }
        input[type="file"] { display: none; }
        
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #00bcd4;
        }

        /* Caixa preta para listar os campos encontrados no seu PDF */
        .info-box {
            background: #1a1a24;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #444;
            display: none;
            font-family: monospace;
            color: #a5d6a7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Corretor de Layout (C4 ⇄ C7)</h1>
    <p>Este utilitário processa o seu PDF que <strong>já possui os campos editáveis</strong>. Ele localiza os alvos de <strong>C4 (Total 1)</strong> e <strong>C7 (Total 2)</strong> e inverte as posições físicas deles no papel, corrigindo o erro de digitação/clique.</p>
    
    <label class="upload-box">
        <span id="upload-text">Clique aqui para selecionar o seu PDF já existente</span>
        <input type="file" id="pdf-input" accept=".pdf">
    </label>

    <div class="status" id="status-message">Aguardando arquivo PDF...</div>
    
    <div class="info-box" id="info-box"></div>
    
    <button id="process-btn" disabled>Trocar Posições e Baixar PDF Corrigido</button>
</div>

<script>
    const pdfInput = document.getElementById('pdf-input');
    const uploadText = document.getElementById('upload-text');
    const processBtn = document.getElementById('process-btn');
    const statusMessage = document.getElementById('status-message');
    const infoBox = document.getElementById('info-box');
    
    let pdfBytes = null;

    // 1. CARREGA O PDF EXISTENTE
    pdfInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadText.innerText = `Arquivo carregado: ${file.name}`;
        statusMessage.innerText = "Analisando estrutura de campos internos...";
        
        const arrayBuffer = await file.arrayBuffer();
        pdfBytes = new Uint8Array(arrayBuffer);
        
        try {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const form = pdfDoc.getForm();
            const fields = form.getFields();
            
            // Mapeia e mostra todos os nomes de campos salvos no PDF
            const names = fields.map(f => f.getName());
            infoBox.innerHTML = "<strong>Campos identificados no PDF:</strong><br>" + names.join(', ');
            infoBox.style.display = "block";
            
            statusMessage.innerText = `PDF pronto para correção! (${fields.length} campos encontrados)`;
            processBtn.disabled = false;
        } catch (err) {
            statusMessage.innerText = "Erro ao ler os campos internos do PDF.";
            alert("Erro na leitura: " + err.message);
        }
    });

    // 2. FAZ A INVERSÃO DE COORDENADAS DOS DOIS CAMPOS
    processBtn.addEventListener('click', async () => {
        try {
            statusMessage.innerText = "Localizando C4 e C7 e invertendo posições...";
            
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const form = pdfDoc.getForm();
            const fields = form.getFields();

            let campoC4 = null;
            let campoC7 = null;

            // Busca inteligente: verifica se o nome é 'res'/'res2' (do script antigo) ou 'c4'/'c7'
            fields.forEach(field => {
                const name = field.getName().toLowerCase();
                
                // Identificadores possíveis para o C4 (Total 1)
                if (name === 'res' || name === 'c4' || name === 'c4 (total 1)') {
                    campoC4 = field;
                }
                // Identificadores possíveis para o C7 (Total 2)
                if (name === 'res2' || name === 'c7' || name === 'c7 (total 2)') {
                    campoC7 = field;
                }
            });

            // Fallback por aproximação caso os nomes tenham pequenas variações
            if (!campoC4 || !campoC7) {
                fields.forEach(field => {
                    const name = field.getName().toLowerCase();
                    if (name.includes('res') && !name.includes('2')) campoC4 = field;
                    if (name.includes('res2')) campoC7 = field;
                    if (name.includes('c4')) campoC4 = field;
                    if (name.includes('c7')) campoC7 = field;
                });
            }

            // Se achou os dois campos, faz a troca física de lugares
            if (campoC4 && campoC7) {
                const widgetsC4 = campoC4.acroField.getWidgets();
                const widgetsC7 = campoC7.acroField.getWidgets();

                if (widgetsC4.length > 0 && widgetsC7.length > 0) {
                    // Pega as coordenadas X, Y, Largura e Altura originais de cada um
                    const rectC4 = widgetsC4[0].getRectangle();
                    const rectC7 = widgetsC7[0].getRectangle();

                    // Aplica a posição do C7 no campo C4
                    widgetsC4[0].setRectangle({
                        x: rectC7.x,
                        y: rectC7.y,
                        width: rectC7.width,
                        height: rectC7.height
                    });

                    // Aplica a posição original do C4 no campo C7
                    widgetsC7[0].setRectangle({
                        x: rectC4.x,
                        y: rectC4.y,
                        width: rectC4.width,
                        height: rectC4.height
                    });

                    statusMessage.innerText = `Inversão concluída entre [${campoC4.getName()}] e [${campoC7.getName()}]. Salvando...`;

                    // Compila o novo PDF modificado e dispara o download automático
                    const modifiedPdfBytes = await pdfDoc.save();
                    const blob = new Blob([modifiedPdfBytes], { type: "application/pdf" });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "ficha_posicoes_corrigidas.pdf";
                    a.click();
                    
                    statusMessage.innerText = "Pronto! O PDF corrigido foi baixado.";
                } else {
                    statusMessage.innerText = "Erro: Estrutura visual dos campos corrompida.";
                }
            } else {
                statusMessage.innerText = "Erro: Não foi possível identificar os campos C4 e C7.";
                alert("Os campos C4 e C7 não foram achados com os nomes padrão. Dê uma olhada na lista verde exibida na tela para ver como eles estão nomeados internamente.");
            }

        } catch (err) {
            console.error(err);
            statusMessage.innerText = "Erro técnico ao modificar o PDF.";
            alert("Erro: " + err.message);
        }
    });
</script>

</body>
</html>
