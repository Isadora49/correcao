<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem Interativa</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .ficha { background: #202024; width: 100%; max-width: 800px; border: 2px solid #323238; border-radius: 8px; padding: 30px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #00b37e; text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .cabecalho { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .dados-pessoais { flex: 2; display: flex; flex-direction: column; gap: 15px; min-width: 250px; }
        
        .campo-texto { display: flex; flex-direction: column; }
        label { font-size: 12px; color: #a8a8b3; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { background: #121214; border: 1px solid #41414d; padding: 10px; border-radius: 4px; color: #fff; font-size: 14px; }
        
        /* Área do Avatar Customizada */
        .area-avatar { flex: 1; min-width: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container-foto { width: 180px; height: 180px; border: 2px dashed #00b37e; background: #121214; border-radius: 4px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .container-foto img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .container-foto span { color: #00b37e; font-size: 13px; text-align: center; padding: 10px; font-weight: bold; }
        #fileInput { display: none; }

        .botoes { width: 100%; max-width: 800px; margin-top: 20px; display: flex; gap: 15px; }
        button { flex: 1; background: #00b37e; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00875f; }
        button.secundario { background: #29292e; border: 1px solid #41414d; }
        button.secundario:hover { background: #323238; }

        /* Ajustes para a hora de salvar/imprimir */
        @media print {
            body { background: #fff; color: #000; padding: 0; }
            .ficha { border: none; box-shadow: none; width: 100%; padding: 0; background: #fff; }
            input[type="text"], textarea { border-bottom: 1px solid #000 !important; border: none; background: transparent; color: #000; padding: 5px 0; }
            .container-foto { border: 2px solid #000; background: #fff; }
            .botoes, label { color: #000; }
            button { display: none; }
        }
    </style>
</head>
<body>

    <div class="ficha" id="conteudoFicha">
        <h1>Ficha de Personagem</h1>
        
        <div class="cabecalho">
            <div class="dados-pessoais">
                <div class="campo-texto">
                    <label>Nome do Personagem</label>
                    <input type="text" placeholder="Ex: Aratorn">
                </div>
                <div class="campo-texto">
                    <label>Classe & Nível</label>
                    <input type="text" placeholder="Ex: Guerreiro - Nvl 5">
                </div>
            </div>
            
            <div class="area-avatar">
                <label>Foto do Avatar</label>
                <div class="container-foto" onclick="dispararUpload()">
                    <span id="textoPlaceholder">Clique para carregar a foto</span>
                    <img id="imagemAvatar" alt="Avatar">
                </div>
                <input type="file" id="fileInput" accept="image/*" onchange="carregarImagem(event)">
            </div>
        </div>

        <div class="campo-texto">
            <label>História e Notas</label>
            <textarea rows="6" placeholder="Escreva os detalhes da sua jornada..."></textarea>
        </div>
    </div>

    <div class="botoes">
        <button class="secundario" onclick="limparFicha()">Limpar Campos</button>
        <button onclick="salvarFichaPDF()">Salvar Ficha como PDF</button>
    </div>

    <script>
        function dispararUpload() {
            document.getElementById('fileInput').click();
        }

        // Carrega a imagem local do usuário e exibe na tela DO NAVEGADOR na hora
        function carregarImagem(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('imagemAvatar');
                    const placeholder = document.getElementById('textoPlaceholder');
                    
                    img.src = e.target.result;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                reader.readAsDataURL(arquivo);
            }
        }

        function limparFicha() {
            const inputs = document.querySelectorAll('input[type="text"], textarea');
            inputs.forEach(input => input.value = '');
            
            const img = document.getElementById('imagemAvatar');
            const placeholder = document.getElementById('textoPlaceholder');
            img.src = '';
            img.style.style.display = 'none';
            placeholder.style.display = 'block';
            document.getElementById('fileInput').value = '';
        }

        // Usa a engine nativa do navegador para gerar o PDF estável com a foto inclusa
        function salvarFichaPDF() {
            window.print();
        }
    </script>
</body>
</html>
